name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mechanical/robot_simulator_8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Mechanical/robot_simulator_8/requirements-test.txt
      - name: Install the machine learning dependencies (no simulator, no datasets needed)
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest tests -q
